<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HardStore — Produtos de Informática</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg-soft: #151c32;
      --card: #1a2238;
      --border: #273150;
      --text: #e8edf7;
      --muted: #93a1c0;
      --brand: #4f8cff;
      --brand-2: #22d3ee;
      --ok: #34d399;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: radial-gradient(1200px 600px at 70% -10%, #1b2b55 0, transparent 60%), var(--bg);
      color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    a { color: inherit; }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      background: rgba(11,16,32,.85); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 1200px; margin: 0 auto; padding: .9rem 1.25rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .logo { display: flex; align-items: center; gap: .6rem; font-weight: 800; font-size: 1.2rem; letter-spacing: -.02em; }
    .logo .mark {
      width: 30px; height: 30px; border-radius: 8px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      display: grid; place-items: center; font-size: 1rem;
    }
    .logo .pro { color: var(--brand-2); }
    .admin-link {
      margin-left: auto; font-size: .85rem; color: var(--muted); text-decoration: none;
      border: 1px solid var(--border); padding: .45rem .8rem; border-radius: 10px;
    }
    .admin-link:hover { color: var(--text); border-color: var(--brand); }

    .hero { max-width: 1200px; margin: 0 auto; padding: 2.5rem 1.25rem 1rem; text-align: center; }
    .hero h1 { font-size: clamp(1.6rem, 3vw, 2.4rem); margin: 0 0 .4rem; letter-spacing: -.03em; }
    .hero p { color: var(--muted); margin: 0 0 1.5rem; }
    .searchbar { display: flex; gap: .6rem; max-width: 640px; margin: 0 auto; }
    .searchbar input {
      flex: 1; padding: .9rem 1.1rem; font-size: 1rem; color: var(--text);
      background: var(--bg-soft); border: 1px solid var(--border); border-radius: 12px;
    }
    .searchbar input:focus { outline: none; border-color: var(--brand); }
    .searchbar button {
      padding: 0 1.4rem; font-size: 1rem; font-weight: 700; cursor: pointer;
      color: #04122b; border: 0; border-radius: 12px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
    }
    .searchbar button:disabled { opacity: .6; cursor: default; }

    .wrap { max-width: 1200px; margin: 0 auto; padding: 1rem 1.25rem 4rem; }
    .status { color: var(--muted); font-size: .9rem; margin: .5rem 0 1.2rem; min-height: 1.2rem; }

    .grid {
      display: grid; gap: 1.1rem;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; display: flex; flex-direction: column;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .card:hover { transform: translateY(-3px); border-color: var(--brand); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    .thumb {
      aspect-ratio: 4/3; background: var(--bg-soft); display: grid; place-items: center; overflow: hidden;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb .ph { color: var(--border); font-size: 2.5rem; }
    .card-body { padding: .9rem 1rem 1.1rem; display: flex; flex-direction: column; gap: .5rem; flex: 1; }
    .badges { display: flex; gap: .4rem; flex-wrap: wrap; }
    .badge {
      font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; font-weight: 700;
      padding: .2rem .5rem; border-radius: 999px; background: #0f1830; color: var(--brand-2); border: 1px solid var(--border);
    }
    .badge.marca { color: var(--muted); }
    .name { font-weight: 700; line-height: 1.3; }
    .desc { color: var(--muted); font-size: .85rem; line-height: 1.4; flex: 1;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .price { font-size: 1.25rem; font-weight: 800; color: var(--ok); margin-top: .2rem; }

    .skeleton .thumb, .skeleton .line {
      background: linear-gradient(90deg, #1a2238, #222c47, #1a2238);
      background-size: 200% 100%; animation: sh 1.2s infinite;
    }
    .skeleton .line { height: 12px; border-radius: 6px; margin: .4rem 0; }
    .skeleton .line.w60 { width: 60%; } .skeleton .line.w40 { width: 40%; }
    @keyframes sh { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); }
    .empty .big { font-size: 2.5rem; margin-bottom: .5rem; }
    .section-title { font-size: .95rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 1rem; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo"><span class="mark">⚡</span> Hard<span class="pro">Store</span></div>
      <a class="admin-link" href="/admin.html">+ Admin</a>
    </div>
  </header>

  <section class="hero">
    <h1>Encontre o hardware certo</h1>
    <p>Busca inteligente no catálogo — nome, marca, specs. Tolera erro de digitação.</p>
    <form class="searchbar" id="form">
      <input id="q" type="search" placeholder="ex.: notebook i7 16gb, ssd nvme, placa de vídeo…" autofocus />
      <button id="btn" type="submit">Buscar</button>
    </form>
  </section>

  <main class="wrap">
    <p class="section-title" id="sectionTitle">Destaques</p>
    <div class="status" id="status"></div>
    <div class="grid" id="results"></div>
  </main>

  <script>
    const API = "/busca";
    const form = document.getElementById("form");
    const input = document.getElementById("q");
    const btn = document.getElementById("btn");
    const statusEl = document.getElementById("status");
    const results = document.getElementById("results");
    const sectionTitle = document.getElementById("sectionTitle");

    const fmtPreco = (v) =>
      v == null ? "" : new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(v);
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));

    function skeletons(n = 8) {
      results.innerHTML = Array.from({ length: n }).map(() => `
        <div class="card skeleton">
          <div class="thumb"></div>
          <div class="card-body">
            <div class="line w40"></div><div class="line"></div><div class="line w60"></div>
          </div>
        </div>`).join("");
    }

    function cardHtml(p) {
      const img = p.imagem_url
        ? `<img src="${esc(p.imagem_url)}" alt="${esc(p.nome)}" loading="lazy" onerror="this.parentNode.innerHTML='<span class=&quot;ph&quot;>🖥️</span>'" />`
        : `<span class="ph">🖥️</span>`;
      const badges = [
        p.categoria ? `<span class="badge">${esc(p.categoria)}</span>` : "",
        p.marca ? `<span class="badge marca">${esc(p.marca)}</span>` : "",
      ].join("");
      return `
        <article class="card">
          <div class="thumb">${img}</div>
          <div class="card-body">
            <div class="badges">${badges}</div>
            <div class="name">${esc(p.nome)}</div>
            ${p.descricao ? `<div class="desc">${esc(p.descricao)}</div>` : ""}
            <div class="price">${fmtPreco(p.preco)}</div>
          </div>
        </article>`;
    }

    function renderEmpty(termo) {
      results.innerHTML = `
        <div class="empty" style="grid-column: 1/-1">
          <div class="big">🔍</div>
          <div>Nenhum produto encontrado${termo ? ` para “${esc(termo)}”` : ""}.</div>
        </div>`;
    }

    async function carregar(termo) {
      skeletons();
      statusEl.textContent = termo ? "Buscando…" : "Carregando destaques…";
      btn.disabled = true;
      try {
        const url = termo ? `${API}?q=${encodeURIComponent(termo)}` : API;
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const produtos = data.produtos || [];
        sectionTitle.textContent = data.destaque ? "Destaques" : "Resultados";
        if (produtos.length === 0) {
          statusEl.textContent = "";
          renderEmpty(termo);
        } else {
          statusEl.textContent = data.destaque
            ? `${produtos.length} produto(s) em destaque`
            : `${produtos.length} resultado(s) para “${esc(data.termo)}”`;
          results.innerHTML = produtos.map(cardHtml).join("");
        }
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Não foi possível carregar agora. Tente novamente em instantes.";
        results.innerHTML = "";
      } finally {
        btn.disabled = false;
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      carregar(input.value.trim());
    });

    // Vitrine inicial: destaques (busca sem termo).
    carregar("");
  </script>
</body>
</html>
