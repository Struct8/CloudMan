<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Busca de Produtos de Informática</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0; background: #0f172a; color: #e2e8f0;
    }
    header { padding: 2rem 1rem 1rem; text-align: center; }
    h1 { margin: 0 0 .25rem; font-size: 1.5rem; }
    header p { margin: 0; color: #94a3b8; font-size: .9rem; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 1rem; }
    form { display: flex; gap: .5rem; margin: 1rem 0; }
    input[type=search] {
      flex: 1; padding: .75rem 1rem; border-radius: .5rem;
      border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 1rem;
    }
    button {
      padding: .75rem 1.25rem; border: 0; border-radius: .5rem;
      background: #38bdf8; color: #0f172a; font-weight: 600; cursor: pointer; font-size: 1rem;
    }
    button:disabled { opacity: .5; cursor: default; }
    .status { color: #94a3b8; font-size: .9rem; min-height: 1.2rem; }
    ul { list-style: none; padding: 0; margin: 1rem 0; }
    li {
      background: #1e293b; border: 1px solid #334155; border-radius: .5rem;
      padding: .9rem 1rem; margin-bottom: .6rem;
    }
    .nome { font-weight: 600; }
    .meta { color: #94a3b8; font-size: .85rem; margin-top: .2rem; }
    .preco { color: #38bdf8; font-weight: 600; float: right; }
  </style>
</head>
<body>
  <header>
    <h1>Busca de Produtos</h1>
    <p>Catálogo de informática — FTS + fuzzy via Aurora PostgreSQL</p>
  </header>
  <main class="wrap">
    <form id="form">
      <input id="q" type="search" placeholder="ex.: notebook i7 16gb" autofocus />
      <button id="btn" type="submit">Buscar</button>
    </form>
    <div class="status" id="status"></div>
    <ul id="results"></ul>
  </main>

  <script>
    // Mesmo dominio do CloudFront: a rota /busca* e roteada para a API.
    // Nao precisa de URL absoluta nem CORS.
    const API_PATH = "/busca";

    const form = document.getElementById("form");
    const input = document.getElementById("q");
    const btn = document.getElementById("btn");
    const statusEl = document.getElementById("status");
    const results = document.getElementById("results");

    const fmtPreco = (v) =>
      v == null ? "" : new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(v);

    async function buscar(termo) {
      results.innerHTML = "";
      statusEl.textContent = "Buscando...";
      btn.disabled = true;
      try {
        const res = await fetch(`${API_PATH}?q=${encodeURIComponent(termo)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const produtos = data.produtos || [];
        statusEl.textContent = `${data.total ?? produtos.length} resultado(s) para "${data.termo ?? termo}"`;
        results.innerHTML = produtos.map((p) => `
          <li>
            <span class="preco">${fmtPreco(p.preco)}</span>
            <div class="nome">${p.nome ?? ""}</div>
            <div class="meta">${[p.marca, p.categoria].filter(Boolean).join(" · ")}</div>
          </li>
        `).join("");
        if (produtos.length === 0) statusEl.textContent = `Nenhum resultado para "${termo}".`;
      } catch (err) {
        statusEl.textContent = "Erro ao buscar. Tente novamente.";
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const termo = input.value.trim();
      if (termo) buscar(termo);
    });
  </script>
</body>
</html>
