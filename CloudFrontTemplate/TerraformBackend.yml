# Onboarding stack the customer opens from the GitOps Workspace deep link
# (AgentV2.GenerateConnectionLinkTerraformBackend).
#
# PUBLISHED AT:
#   s3://struct8-gitops-backend-templates/templates/TerraformBackend.yml
# A private bucket: AgentV2 hands the customer's console a signed link to it, and
# writes update templates with parameters pinned under generated/ in the same bucket.
# Editing this file changes nothing until that object is replaced.
#
# Blast radius of a change here: new stacks only. An account onboarded earlier keeps
# the role it already has until someone updates its stack.
AWSTemplateFormatVersion: '2010-09-09'
Description: Terraform backend with GitHub Actions OIDC. Creates S3 and DynamoDB only if requested.

Parameters:
  UserName:
    Description: "User who triggered the creation (Struct8User Tag)."
    Type: String
    Default: "Struct8-user"

  # --- S3 CONFIGURATION ---
  CreateS3Bucket:
    Description: >-
      Create the S3 bucket named in S3BucketName (true/false). Choose false when the
      bucket already exists, such as a bucket that already holds Terraform state.
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

  S3BucketName:
    Description: >-
      Name of the S3 bucket that holds the Terraform state. Bucket names are unique
      across AWS. With CreateS3Bucket set to false, the bucket must already exist. The
      deploy role cannot delete this bucket whether or not this stack created it.
    Type: String

  S3LifecycleNoncurrentDays:
    Description: >-
      Days after which a version of an object that is no longer the current one is
      deleted from the bucket this stack creates. Empty means no lifecycle rule and
      every version is kept. Has no effect on a bucket this stack does not create.
    Type: String
    Default: ""
    AllowedPattern: "^([1-9][0-9]{0,4})?$"

  S3LifecycleKeepNewerVersions:
    Description: >-
      How many of the most recent noncurrent versions of an object are kept even
      when they are older than S3LifecycleNoncurrentDays (1 to 100). Empty keeps none
      beyond that age. Only read when S3LifecycleNoncurrentDays is set.
    Type: String
    Default: ""
    AllowedPattern: "^(100|[1-9][0-9]?)?$"

  S3KmsKey:
    Description: >-
      The KMS key that encrypts new objects in the bucket this stack creates. Empty
      means SSE-S3 (AES256), at no cost. stack means the key this stack creates. Or
      the ARN of a customer managed key, enabled, symmetric and in the same region.
      Objects already in the bucket keep the encryption they were written with. Has
      no effect on a bucket this stack does not create.
    Type: String
    Default: ""
    AllowedPattern: "^(stack|arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[A-Za-z0-9-]+)?$"

  # --- KMS KEY CREATED BY THIS STACK ---
  BackendKmsKeyName:
    Description: >-
      Name tag of the KMS key this stack creates. The key is created only while
      S3KmsKey or DynamoDBKmsKey is set to stack.
    Type: String
    Default: ""
    AllowedPattern: "^[A-Za-z0-9 _.:/=+@-]{0,256}$"

  BackendKmsKeyAlias:
    Description: >-
      Alias of the KMS key this stack creates, such as alias/backend-key-1a2b3c4d.
      Terraform states find the key by this alias.
    Type: String
    Default: ""
    AllowedPattern: "^(alias/[A-Za-z0-9_-]{1,250})?$"

  # --- DYNAMODB CONFIGURATION ---
  CreateDynamoDBTable:
    Description: "Do you want to create the DynamoDB table for State Locking? (true/false)."
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

  DynamoDBTableName:
    Description: "Name of the DynamoDB table."
    Type: String
    Default: "terraform-state-lock"

  DynamoDBDeletionProtection:
    Description: >-
      Turn on deletion protection for the lock table this stack creates (true/false).
      While it is on, nobody can delete the table, this stack included, until it is
      turned off. Has no effect on a table this stack does not create.
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

  DynamoDBKmsKey:
    Description: >-
      The KMS key that encrypts the lock table this stack creates. Empty means the
      AWS owned key, at no cost. stack means the key this stack creates. Or the ARN
      of a customer managed key, enabled, symmetric and in the same region. Has no
      effect on a table this stack does not create.
    Type: String
    Default: ""
    AllowedPattern: "^(stack|arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[A-Za-z0-9-]+)?$"

  # --- GITHUB & OIDC CONFIGURATION ---
  CreateOIDCProvider:
    Description: "Creates the OIDC provider if it does not already exist in the account (true/false)."
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

  IAMRoleName:
    Description: "Name of the IAM Role for GitHub Actions."
    Type: String
    Default: "github-actions-terraform-role"

  GitHubOrg:
    Description: "GitHub Organization/User."
    Type: String

  GitHubRepo:
    Description: "Authorized GitHub repository."
    Type: String

  GitHubSubject:
    Description: >-
      Which GitHub Actions workflow run may use this role. Struct8 deploys from the
      main branch, which is the default. Accepted forms: ref:refs/heads/<branch>,
      ref:refs/tags/<tag>, environment:<name>. Wildcards are rejected: a value such
      as * would let a workflow run from any branch of the repository use this role.
    Type: String
    Default: "ref:refs/heads/main"
    AllowedPattern: '^(ref:refs/(heads|tags)/[A-Za-z0-9._\-\/]+|environment:[A-Za-z0-9 ._\-]+)$'
    ConstraintDescription: >-
      Must be ref:refs/heads/<branch>, ref:refs/tags/<tag> or environment:<name>.
  RequireEngineWorkflow:
    Description: >-
      Also require the run to be executing the Struct8 engine -- the reusable
      workflows in Struct8/cloudman-core -- and not just any workflow of the
      repository. Needs the repository's OIDC subject template to include
      job_workflow_ref (Struct8 sets that up); with GitHub's default template the
      subject carries no workflow and this role would refuse every run. false keeps
      the exact-ref match alone. AllowLocalEngineWorkflow adds one workflow of this
      repository, the one that runs the engine on CodeBuild.
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

  AllowLocalEngineWorkflow:
    Description: >-
      With RequireEngineWorkflow set to true, also accept a run of
      .github/workflows/struct8-engine-local.yml on the main branch of this
      repository. Struct8 writes that file when the GitOps workspace is set to run
      the engine on CodeBuild in your account, and its only step runs the Struct8
      engine. No effect while RequireEngineWorkflow is false. Important: anyone who
      can push to main can change that file, and the role then accepts what the
      changed file runs.
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

  SubjectRepoSegment:
    Description: >-
      The repository part of the OIDC subject, as GitHub reports it for this
      repository. Empty means it is built from GitHubOrg and GitHubRepo, which is
      the form GitHub issues for a repository created before 15 July 2026. A
      repository created after that date, and one renamed or transferred after it,
      carries the immutable identifier of the organization and of the repository
      as well, and those identifiers cannot be removed from the subject. Example:
      Struct8@276103125/Import@1360758768. Important: a subject built from names
      alone never matches the token of such a repository, and the role then
      refuses every run. Struct8 fills this in from GitHub when it prepares the
      backend.
    Type: String
    Default: ""

Conditions:
  ShouldCreateS3: !Equals [ !Ref CreateS3Bucket, "true" ]
  HasS3BucketName: !Not [ !Equals [ !Ref S3BucketName, "" ] ]
  HasNoncurrentLifecycle: !Not [ !Equals [ !Ref S3LifecycleNoncurrentDays, "" ] ]
  HasKeepNewerVersions: !Not [ !Equals [ !Ref S3LifecycleKeepNewerVersions, "" ] ]
  ShouldCreateDynamoDB: !Equals [ !Ref CreateDynamoDBTable, "true" ]
  HasS3KmsKey: !Not [ !Equals [ !Ref S3KmsKey, "" ] ]
  S3UsesBackendKmsKey: !Equals [ !Ref S3KmsKey, "stack" ]
  HasDynamoDBKmsKey: !Not [ !Equals [ !Ref DynamoDBKmsKey, "" ] ]
  DynamoDBUsesBackendKmsKey: !Equals [ !Ref DynamoDBKmsKey, "stack" ]
  # The key exists only while a bucket or a table this stack creates uses it.
  ShouldCreateBackendKmsKey: !Or
    - !And [ !Condition ShouldCreateS3, !Condition S3UsesBackendKmsKey ]
    - !And [ !Condition ShouldCreateDynamoDB, !Condition DynamoDBUsesBackendKmsKey ]
  ShouldCreateOIDC: !Equals [ !Ref CreateOIDCProvider, "true" ]
  ShouldRequireEngineWorkflow: !Equals [ !Ref RequireEngineWorkflow, "true" ]
  HasSubjectRepoSegment: !Not [ !Equals [ !Ref SubjectRepoSegment, "" ] ]
  ShouldAllowLocalEngineWorkflow: !And
    - !Condition ShouldRequireEngineWorkflow
    - !Equals [ !Ref AllowLocalEngineWorkflow, "true" ]
  ShouldAllowLocalEngineWorkflowById: !And
    - !Condition ShouldAllowLocalEngineWorkflow
    - !Condition HasSubjectRepoSegment

Resources:
  # 1. OIDC Provider (Optional)
  GithubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOIDC
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1 # Legacy thumbprint (still valid)
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd # New updated thumbprint

  # 2. S3 Bucket for Terraform State (Optional)
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateS3
    # Not a parameter on purpose: nothing a user sets on this stack can make it delete
    # or replace the bucket that holds the Terraform state. Deleting the stack, turning
    # CreateS3Bucket off or changing S3BucketName leaves the bucket and its objects.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref S3BucketName
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - !If
            - HasS3KmsKey
            # S3 Bucket Key: one data key per bucket instead of one KMS call per
            # object, which keeps the KMS request cost of Terraform's reads near zero.
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: aws:kms
                KMSMasterKeyID: !If
                  - S3UsesBackendKmsKey
                  - !GetAtt BackendKmsKey.Arn
                  - !Ref S3KmsKey
              BucketKeyEnabled: true
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
      LifecycleConfiguration: !If
        - HasNoncurrentLifecycle
        - Rules:
            - Id: expire-noncurrent-versions
              Status: Enabled
              NoncurrentVersionExpiration:
                NoncurrentDays: !Ref S3LifecycleNoncurrentDays
                NewerNoncurrentVersions: !If
                  - HasKeepNewerVersions
                  - !Ref S3LifecycleKeepNewerVersions
                  - !Ref "AWS::NoValue"
        - !Ref "AWS::NoValue"
      Tags:
        - Key: Name
          Value: !Ref S3BucketName
        - Key: Struct8User
          Value: !Ref UserName
        - Key: State
          Value: !Ref "AWS::StackName"

  # 3. DynamoDB Table for State Locking (Optional)
  TerraformStateLockTable:
    Type: AWS::DynamoDB::Table
    Condition: ShouldCreateDynamoDB
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref DynamoDBTableName
      AttributeDefinitions:
        - AttributeName: LockID
          AttributeType: S
      KeySchema:
        - AttributeName: LockID
          KeyType: HASH
      # Fixed on purpose: Terraform's lock writes one item keyed by LockID per run, so
      # on-demand billing costs cents and the key cannot be anything else.
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !Ref DynamoDBDeletionProtection
      SSESpecification: !If
        - HasDynamoDBKmsKey
        - SSEEnabled: true
          SSEType: KMS
          KMSMasterKeyId: !If
            - DynamoDBUsesBackendKmsKey
            - !GetAtt BackendKmsKey.Arn
            - !Ref DynamoDBKmsKey
        - !Ref "AWS::NoValue"
      Tags:
        - Key: Name
          Value: !Ref DynamoDBTableName
        - Key: Struct8User
          Value: !Ref UserName
        - Key: State
          Value: !Ref "AWS::StackName"

  # 3b. KMS key for the state bucket and the lock table (Optional)
  BackendKmsKey:
    Type: AWS::KMS::Key
    Condition: ShouldCreateBackendKmsKey
    # Retained like the bucket: state objects written with this key cannot be read
    # without it, so nothing a user sets on this stack schedules its deletion.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypts the Terraform state bucket and lock table of this stack.
      EnableKeyRotation: true
      # The key policy AWS gives a key by default: the account controls the key
      # through IAM, so the deploy role and the account's administrators can use it.
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountControlsKeyThroughIam
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
      Tags:
        - Key: Name
          Value: !Ref BackendKmsKeyName
        - Key: Struct8User
          Value: !Ref UserName
        - Key: State
          Value: !Ref "AWS::StackName"

  # The name Terraform states use to find the key (data "aws_kms_key").
  BackendKmsKeyAliasResource:
    Type: AWS::KMS::Alias
    Condition: ShouldCreateBackendKmsKey
    Properties:
      AliasName: !Ref BackendKmsKeyAlias
      TargetKeyId: !Ref BackendKmsKey

  # 4. IAM Role for GitHub Actions (Always created)
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref IAMRoleName
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              # Fixes Race Condition: Creates implicit dependency only if OIDC is created in the Stack
              Federated: !If
                - ShouldCreateOIDC
                - !Ref GithubOidc
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: "sts:AssumeRoleWithWebIdentity"
            # Both claims are matched exactly. `sub` was `repo:<org>/<repo>:*` until
            # 2026-08-05, which accepted a run from ANY ref of the repository -- with
            # AdministratorAccess attached, a pushed branch was enough to reach the
            # whole account. Struct8 only ever deploys from main (both push paths
            # hardcode it), so exact matching removes reach without removing use.
            # SECOND LAYER, opt-in (RequireEngineWorkflow): the run must also be
            # executing the Struct8 engine. With the repository's subject template
            # including job_workflow_ref, `sub` reads
            #   repo:<org>/<repo>:<subject>:job_workflow_ref:<owner>/<repo>/<path>@<ref>
            # and only the engine's own workflows, on their five channels, plus the
            # lambda sync on main, are listed. Why it matters: a token from any step
            # of a matching job can assume this role, so a workflow the customer
            # wrote -- or a third-party action inside it -- on the same branch was
            # enough before. Now the job has to be one whose code is the engine's.
            #
            # StringEqualsIgnoreCase, not StringEquals: the job_workflow_ref claim
            # carries the spelling of the caller's `uses:` (measured 2026-09-04:
            # `Struct8/cloudman-core`, lower case, from the onboarding template),
            # and a customer who writes it by hand may spell it otherwise. IAM's
            # StringEquals is case-sensitive; GitHub owner and repository names are
            # not.
            Condition: !If
              - ShouldRequireEngineWorkflow
              - StringEquals:
                  token.actions.githubusercontent.com:aud: "sts.amazonaws.com"
                StringEqualsIgnoreCase:
                  token.actions.githubusercontent.com:sub:
                    - !Sub
                      - "repo:${RepoSeg}:${GitHubSubject}:job_workflow_ref:Struct8/cloudman-core/.github/workflows/engine.yml@refs/heads/devlocal"
                      - RepoSeg: !If [ HasSubjectRepoSegment, !Ref SubjectRepoSegment, !Sub "${GitHubOrg}/${GitHubRepo}" ]
                    - !Sub
                      - "repo:${RepoSeg}:${GitHubSubject}:job_workflow_ref:Struct8/cloudman-core/.github/workflows/engine.yml@refs/heads/dev"
                      - RepoSeg: !If [ HasSubjectRepoSegment, !Ref SubjectRepoSegment, !Sub "${GitHubOrg}/${GitHubRepo}" ]
                    - !Sub
                      - "repo:${RepoSeg}:${GitHubSubject}:job_workflow_ref:Struct8/cloudman-core/.github/workflows/engine.yml@refs/heads/test"
                      - RepoSeg: !If [ HasSubjectRepoSegment, !Ref SubjectRepoSegment, !Sub "${GitHubOrg}/${GitHubRepo}" ]
                    - !Sub
                      - "repo:${RepoSeg}:${GitHubSubject}:job_workflow_ref:Struct8/cloudman-core/.github/workflows/engine.yml@refs/heads/alpha"
                      - RepoSeg: !If [ HasSubjectRepoSegment, !Ref SubjectRepoSegment, !Sub "${GitHubOrg}/${GitHubRepo}" ]
                    - !Sub
                      - "repo:${RepoSeg}:${GitHubSubject}:job_workflow_ref:Struct8/cloudman-core/.github/workflows/engine.yml@refs/heads/main"
                      - RepoSeg: !If [ HasSubjectRepoSegment, !Ref SubjectRepoSegment, !Sub "${GitHubOrg}/${GitHubRepo}" ]
                    - !Sub
                      - "repo:${RepoSeg}:${GitHubSubject}:job_workflow_ref:Struct8/cloudman-core/.github/workflows/lambda-sync.yml@refs/heads/main"
                      - RepoSeg: !If [ HasSubjectRepoSegment, !Ref SubjectRepoSegment, !Sub "${GitHubOrg}/${GitHubRepo}" ]
                    # AllowLocalEngineWorkflow: the engine on a CodeBuild project of the
                    # customer's account. That job cannot be engine.yml: GitHub lets a
                    # reusable workflow use the caller's runners only when both have the
                    # same owner, and engine.yml fixes `runs-on: ubuntu-latest`. So it
                    # is .github/workflows/struct8-engine-local.yml of this repository,
                    # whose one step calls Struct8/cloudman-core's
                    # .github/actions/engine-run. What this trusts is that file on main,
                    # not the engine's code -- the parameter's description says so to
                    # whoever turns it on. main is hardcoded like Struct8's push paths;
                    # a role with another GitHubSubject never matches these two.
                    #
                    # The second spelling carries the repository identifiers of
                    # SubjectRepoSegment in job_workflow_ref as well. Not measured yet
                    # whether GitHub writes the claim that way for such a repository;
                    # the first CodeBuild run shows it in CloudTrail. Both spellings
                    # name the same file of the same repository, and AWS::NoValue drops
                    # whichever does not apply.
                    - !If
                      - ShouldAllowLocalEngineWorkflow
                      - !Sub
                        - "repo:${RepoSeg}:${GitHubSubject}:job_workflow_ref:${GitHubOrg}/${GitHubRepo}/.github/workflows/struct8-engine-local.yml@refs/heads/main"
                        - RepoSeg: !If [ HasSubjectRepoSegment, !Ref SubjectRepoSegment, !Sub "${GitHubOrg}/${GitHubRepo}" ]
                      - !Ref AWS::NoValue
                    - !If
                      - ShouldAllowLocalEngineWorkflowById
                      - !Sub "repo:${SubjectRepoSegment}:${GitHubSubject}:job_workflow_ref:${SubjectRepoSegment}/.github/workflows/struct8-engine-local.yml@refs/heads/main"
                      - !Ref AWS::NoValue
              # Flag off: any workflow on the ref -- and in BOTH spellings of the
              # subject. Once the repository's subject template includes
              # job_workflow_ref (the app sets it when it prepares a backend),
              # every token carries `:job_workflow_ref:<workflow>` at the end; an
              # exact match on the short form would then refuse every run of a
              # role created with the flag off. The wildcard is on the workflow
              # only, which is exactly what "flag off" already admits.
              - StringEquals:
                  token.actions.githubusercontent.com:aud: "sts.amazonaws.com"
                StringLike:
                  token.actions.githubusercontent.com:sub:
                    - !Sub
                      - "repo:${RepoSeg}:${GitHubSubject}"
                      - RepoSeg: !If [ HasSubjectRepoSegment, !Ref SubjectRepoSegment, !Sub "${GitHubOrg}/${GitHubRepo}" ]
                    - !Sub
                      - "repo:${RepoSeg}:${GitHubSubject}:job_workflow_ref:*"
                      - RepoSeg: !If [ HasSubjectRepoSegment, !Ref SubjectRepoSegment, !Sub "${GitHubOrg}/${GitHubRepo}" ]
      Policies:
        # Explicit Deny beats the Allow in AdministratorAccess. Scoped to the two
        # objects that ARE this role's own trust, plus audit tampering -- everything
        # else stays open, because Terraform legitimately manages IAM users, EKS OIDC
        # providers and the rest of the account.
        - PolicyName: Struct8ProtectOwnTrust
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Without this, a deploy could rewrite the trust policy above and grant
              # itself the very reach the condition denies.
              - Effect: Deny
                Action:
                  - "iam:UpdateAssumeRolePolicy"
                  - "iam:UpdateRole"
                  - "iam:DeleteRole"
                  - "iam:PutRolePolicy"
                  - "iam:DeleteRolePolicy"
                  - "iam:AttachRolePolicy"
                  - "iam:DetachRolePolicy"
                  - "iam:PutRolePermissionsBoundary"
                  - "iam:DeleteRolePermissionsBoundary"
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${IAMRoleName}"
              # The GitHub provider only. EKS clusters create their own OIDC providers
              # for IRSA and must stay manageable, so this is not a blanket deny.
              - Effect: Deny
                Action:
                  - "iam:DeleteOpenIDConnectProvider"
                  - "iam:UpdateOpenIDConnectProviderThumbprint"
                  - "iam:AddClientIDToOpenIDConnectProvider"
                  - "iam:RemoveClientIDFromOpenIDConnectProvider"
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
              # Struct8 has no CloudTrail resource in its catalog, so denying this
              # cannot block a deploy -- it only stops a deploy from erasing its trail.
              - Effect: Deny
                Action:
                  - "cloudtrail:StopLogging"
                  - "cloudtrail:DeleteTrail"
                  - "cloudtrail:UpdateTrail"
                  - "cloudtrail:PutEventSelectors"
                Resource: "*"
              # The state bucket cannot be deleted by a run that uses this role, whatever
              # the workspace's Terraform says, including a bucket that existed before
              # this stack (CreateS3Bucket false). Objects stay manageable: Terraform
              # deletes state objects of its own workspaces.
              - !If
                - HasS3BucketName
                - Effect: Deny
                  Action:
                    - "s3:DeleteBucket"
                  Resource: !Sub "arn:aws:s3:::${S3BucketName}"
                - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Ref IAMRoleName
        - Key: Struct8User
          Value: !Ref UserName
        - Key: State
          Value: !Ref "AWS::StackName"

Outputs:
  RoleArn:
    Description: "ARN of the Role to use in GitHub Actions"
    Value: !GetAtt GitHubActionsRole.Arn

  AllowedSubject:
    Description: "The GitHub Actions subject(s) that can use this role"
    Value: !If
      - ShouldAllowLocalEngineWorkflow
      - !Sub
        - "repo:${RepoSeg}:${GitHubSubject}:job_workflow_ref:{Struct8/cloudman-core/.github/workflows/{engine.yml@refs/heads/<devlocal|dev|test|alpha|main> | lambda-sync.yml@refs/heads/main} | ${GitHubOrg}/${GitHubRepo}/.github/workflows/struct8-engine-local.yml@refs/heads/main}"
        - RepoSeg: !If [ HasSubjectRepoSegment, !Ref SubjectRepoSegment, !Sub "${GitHubOrg}/${GitHubRepo}" ]
      - !If
        - ShouldRequireEngineWorkflow
        - !Sub
          - "repo:${RepoSeg}:${GitHubSubject}:job_workflow_ref:Struct8/cloudman-core/.github/workflows/{engine.yml@refs/heads/<devlocal|dev|test|alpha|main> | lambda-sync.yml@refs/heads/main}"
          - RepoSeg: !If [ HasSubjectRepoSegment, !Ref SubjectRepoSegment, !Sub "${GitHubOrg}/${GitHubRepo}" ]
        - !Sub
          - "repo:${RepoSeg}:${GitHubSubject}"
          - RepoSeg: !If [ HasSubjectRepoSegment, !Ref SubjectRepoSegment, !Sub "${GitHubOrg}/${GitHubRepo}" ]

  BucketName:
    Condition: ShouldCreateS3
    Description: "Name of the created S3 Bucket"
    Value: !Ref TerraformStateBucket

  DynamoDBTable:
    Condition: ShouldCreateDynamoDB
    Description: "Name of the created DynamoDB table"
    Value: !Ref TerraformStateLockTable
